<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vokabel-App</title>
<meta name="description" content="Vokabelzettel fotografieren und Vokabeln schriftlich üben.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1626" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column like a Vokabelheft page; lists drawn as two-column ruled pages with a red middle line, practice as an index card. */
:root{
  --paper:#f6f8fb; --sheet:#ffffff; --ink:#18233a; --ink-soft:#56627a; --rule:#d7e1ee;
  --margin:#d9473b; --marker:#ffd84a; --marker-ink:#3b2f00; --blue:#2f5bd3;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c23a2f; --bad-bg:#fbe8e6; --warn-bg:#fff4cc;
  --shadow:0 1px 0 rgba(24,35,58,.06),0 6px 18px -10px rgba(24,35,58,.25);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1626; --sheet:#172036; --ink:#e8edf7; --ink-soft:#9aa7c0; --rule:#283552;
  --margin:#ff7a6b; --marker:#ffd84a; --marker-ink:#3b2f00; --blue:#86a6ff;
  --ok:#5fd394; --ok-bg:#163527; --bad:#ff8a7c; --bad-bg:#3a1c1b; --warn-bg:#3a3214;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1626; --sheet:#172036; --ink:#e8edf7; --ink-soft:#9aa7c0; --rule:#283552;
  --margin:#ff7a6b; --marker:#ffd84a; --marker-ink:#3b2f00; --blue:#86a6ff;
  --ok:#5fd394; --ok-bg:#163527; --bad:#ff8a7c; --bad-bg:#3a1c1b; --warn-bg:#3a3214;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-soft)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand mark{background:var(--marker);color:var(--marker-ink);padding:0 .25em;border-radius:3px}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{border:2px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.kid .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.kid[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.kid.add{color:var(--ink-soft);font-weight:400}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--rule)}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--margin)}

/* buttons */
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.hl{background:var(--marker);color:var(--marker-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--rule)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* sheet / vokabelheft */
.sheet{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.heft{display:grid;grid-template-columns:1fr 1fr;position:relative;background:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);border-top:1px solid var(--rule)}
.heft::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--margin);opacity:.75}
.heft > div{padding:0 10px;height:36px;line-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.heft .more{grid-column:1/-1;color:var(--ink-soft);font-size:.875rem;text-align:center}

.list-card{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--paper);color:var(--ink-soft)}
.meter{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.nums{font-variant-numeric:tabular-nums}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:2px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:120px}
.drop{border:2px dashed var(--rule);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--blue)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:76px;height:96px;object-fit:cover;border-radius:6px;box-shadow:var(--shadow)}
.thumb{position:relative}
.thumb-x{position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;border:2px solid var(--sheet);background:var(--bad);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.note{border-radius:10px;padding:10px 14px;background:var(--warn-bg);font-size:.9rem}
.note.bad{background:var(--bad-bg);color:var(--bad)}

/* review table */
.edit{display:flex;flex-direction:column}
.edit-row{display:grid;grid-template-columns:1fr 1fr 40px;position:relative;border-bottom:1px solid var(--rule)}
.edit-row::before{content:"";position:absolute;top:0;bottom:0;left:calc((100% - 40px)/2);width:2px;background:var(--margin);opacity:.7}
.edit-row input{border:0;background:transparent;padding:10px 10px;min-height:44px;min-width:0;width:100%}
.edit-row input:focus{background:var(--paper);outline:none;box-shadow:inset 0 -2px 0 var(--blue)}
.edit-row.head{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-soft)}
.edit-row.head span{padding:6px 10px}
.x{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:1.2rem;min-height:44px}
.flag input{color:var(--bad)}

/* practice card */
.card{background:var(--sheet);border-radius:6px 6px 14px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;padding:44px 20px 22px;display:flex;flex-direction:column;gap:16px;
  background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-size:100% 2px,100% 100%;background-position:0 30px,0 0;background-repeat:no-repeat,repeat}
.card .dir{position:absolute;top:6px;left:20px;right:20px;display:flex;justify-content:space-between}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.15;text-align:center;padding:10px 0;overflow-wrap:anywhere;text-wrap:balance}
.answer-in{border:2px solid var(--rule);border-radius:12px;padding:14px;font-size:1.25rem;width:100%;background:var(--paper);text-align:center}
.answer-in.ok{border-color:var(--ok);background:var(--ok-bg)}
.answer-in.bad{border-color:var(--bad);background:var(--bad-bg)}
.feedback{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:center}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .sol{font-size:1.2rem;font-weight:700;color:var(--ink)}
.chars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chars button{min-width:40px;min-height:40px;border-radius:8px;border:2px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:1.05rem}
.speak{border:0;background:none;cursor:pointer;color:var(--blue);font-weight:700;min-height:36px}
.progress{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--paper);border-radius:10px;padding:12px;text-align:center}
.stat strong{display:block;font-family:var(--f-display);font-size:1.6rem}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar i{transition:none}}
@media (max-width:460px){.heft > div{padding:0 6px;font-size:.92rem}.card{padding-inline:14px}}

html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px}
.page-div{margin-top:14px;padding:10px 12px;background:var(--paper);border-radius:10px;border-left:4px solid var(--blue);display:flex;flex-direction:column;gap:8px;scroll-margin-top:calc(12px + env(safe-area-inset-top,0px))}
.page-img{width:100%;max-height:75vh;object-fit:contain;border-radius:8px;background:var(--sheet)}
.btn.mini{min-height:36px;padding:6px 12px;font-size:.875rem}
.warnline{color:var(--bad);margin:0}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
body.has-bg{background:transparent}
html{background:var(--paper)}
body.has-bg .top, body.has-bg .tabs, body.has-bg #storeNote, body.has-bg .progress2{background:var(--sheet);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
body.has-bg .tab{margin-bottom:0}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bg-tile{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent;border-radius:14px;padding:6px;background:var(--paper);cursor:pointer;color:var(--ink)}
.bg-tile.on{border-color:var(--blue)}
.bg-prev{width:100%;aspect-ratio:3/4;border-radius:10px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-plus{font-size:2rem;color:var(--ink-soft);font-weight:700}
body.practicing .top, body.practicing .tabs, body.practicing #storeNote{display:none}
body.practicing .wrap{gap:10px}
.practice{display:flex;flex-direction:column;gap:10px}
.practice .card{padding:34px 16px 16px;gap:12px}
.practice .prompt{font-size:clamp(1.4rem,6vw,2.1rem);padding:4px 0}
.practice .answer-in{padding:10px 12px}
.progress2{display:flex;flex-direction:column;gap:6px}
.pg-row{display:grid;grid-template-columns:62px 1fr auto 64px;align-items:center;gap:8px}
.pg-label{color:var(--ink-soft);font-weight:700}
.pg-num{min-width:52px;text-align:right}
.ok-num{color:var(--ok);font-weight:700}
.bar-asked{background:var(--blue)!important}
.toggle{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink)}
.toggle[aria-checked="true"]{border-color:var(--ink)}
.toggle:disabled{opacity:.55;cursor:default}
.tg-box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1}
.toggle[aria-checked="true"] .tg-box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tg-text{display:flex;flex-direction:column;gap:2px}
.crop-stage{display:flex;justify-content:center;background:var(--paper);border-radius:10px;padding:8px}
.crop-wrap{position:relative;display:inline-block;max-width:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0}
.crop-wrap img{display:block;max-width:100%;max-height:65vh;-webkit-touch-callout:none;pointer-events:none}
.crop-rect{position:absolute;border:2px solid var(--marker);box-shadow:0 0 0 9999px rgba(10,15,30,.55);cursor:move}
.crop-h{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--marker);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.crop-h.nw{left:-8px;top:-8px}.crop-h.ne{right:-8px;top:-8px}.crop-h.sw{left:-8px;bottom:-8px}.crop-h.se{right:-8px;bottom:-8px}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Vokabel-<mark>App</mark></h1></div>
    <div class="kids" id="kids"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" id="tab-lists" data-view="lists">Meine Listen</button>
    <button class="tab" role="tab" id="tab-new" data-view="new">Neue Liste</button>
  </nav>
  <main id="main"></main>
  <p class="muted small" id="storeNote"></p>
</div>

<script src="pair.js"></script>
<script>
(() => {
const LANGS = {
  en:{name:"Englisch", tts:"en-GB", chars:[]},
  es:{name:"Spanisch", tts:"es-ES", chars:["á","é","í","ó","ú","ñ","ü","¿","¡"]},
  fr:{name:"Französisch", tts:"fr-FR", chars:["à","â","ç","é","è","ê","ë","î","ï","ô","ù","û","œ"]},
  la:{name:"Latein", tts:null, chars:["ā","ē","ī","ō","ū"]},
};
const KID_COLORS = ["#2f5bd3","#d9473b","#1f8a4c","#a24fd0","#d98a1b"];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith("--")) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ---------- state ---------- */
const S = {
  profiles: [], lists: [],
  kid: ls.get("vk-kid", null),
  view: "lists",
  db: null, sample: null, imgLimits: null, loaded: false,
  draft: null,      // list being created/edited
  session: null,    // practice session
  confirmDel: null, addingKid: false,
};

/* ---------- storage: this device ---------- */
const standalone = (() => { try { return navigator.standalone === true || matchMedia("(display-mode: standalone)").matches; } catch { return false; } })();
const Store = {
  async init(){
    const d = ls.get("vk-data", {profiles:[], lists:[]});
    S.profiles = Array.isArray(d.profiles) ? d.profiles : [];
    S.lists = Array.isArray(d.lists) ? d.lists : [];
    S.loaded = true;
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    $("#storeNote").textContent = standalone
      ? "Deine Listen sind auf diesem Gerät gespeichert. Version 28.10.2026 d"
      : "Tipp: In Safari auf „Teilen“ → „Zum Home-Bildschirm“ tippen, dann startet die Vokabel-App wie eine richtige App. Deine Listen bleiben auf diesem Gerät. Version 28.10.2026 d";
    afterData();
    checkImport();
  },
  save(){ ls.set("vk-data", {profiles:S.profiles, lists:S.lists}); },
  async putProfile(p){ upsert(S.profiles, p); this.save(); },
  async delProfile(id){
    S.profiles = S.profiles.filter(p => p.id !== id);
    S.lists = S.lists.filter(l => l.profileId !== id);
    this.save();
  },
  async putList(l){ upsert(S.lists, l); this.save(); },
  async delList(id){ S.lists = S.lists.filter(l => l.id !== id); this.save(); },
};

/* ---------- import from a link (#import=...) ---------- */
function b64uDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "=";
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(out);
}
function checkImport(text){
  const fromPaste = typeof text === "string";
  const m = (fromPaste ? text : location.hash).match(/#import=([A-Za-z0-9_-]+)/);
  if (!m) { if (fromPaste) { S.draft && (S.draft.error = "Das ist kein Link aus der Vokabel-App. Kopiere den ganzen Link aus der Nachricht."); renderMain(); } return; }
  try {
    const o = JSON.parse(b64uDecode(m[1]));
    const pairs = (Array.isArray(o.p) ? o.p : []).filter(x => Array.isArray(x) && x[0] && x[1])
      .map(([fx,de]) => ({id:uid(), fx:String(fx).slice(0,200), de:String(de).slice(0,200), box:0}));
    if (!pairs.length) throw new Error("leer");
    S.pendingImport = {title:String(o.t||"").slice(0,80), lang: LANGS[o.l] ? o.l : "en", pairs};
  } catch { S.pendingImport = {error:true}; }
  if (!fromPaste) { try { history.replaceState(null, "", location.pathname + location.search); } catch {} }
  go("import");
}
function viewImport(){
  const im = S.pendingImport;
  if (!im) { S.view = "lists"; return viewLists(); }
  if (im.error) return h("div",{class:"sheet empty"},
    h("h2",null,"Dieser Link funktioniert nicht"),
    h("p",{class:"muted"},"Der Link ist unvollständig. Bitte lass ihn dir noch einmal schicken."),
    h("button",{class:"btn hl",onclick:()=>{S.pendingImport=null;go("lists");}},"Zu meinen Listen"));
  const k = curKid();
  const L = LANGS[im.lang];
  return h("div",{class:"sheet"},
    h("div",null,h("p",{class:"label"},`Neue Liste · ${L.name} · ${im.pairs.length} Vokabeln`),h("h2",null,im.title || "Vokabelliste")),
    h("div",{class:"heft","aria-hidden":"true"},
      im.pairs.slice(0,6).map(p => [h("div",null,p.fx), h("div",null,p.de)]),
      im.pairs.length>6 ? h("div",{class:"more"}, `+ ${im.pairs.length-6} weitere`) : null),
    !standalone ? h("p",{class:"note"},"Hast du die Vokabel-App auf dem Home-Bildschirm? Dann kopiere den Link aus der Nachricht und füge ihn dort unter „Neue Liste“ → „Liste aus Link übernehmen“ ein. Nur so landet die Liste in deiner App.") : null,
    k ? h("div",{class:"row"},
          h("button",{class:"btn hl grow",onclick:async()=>{

async function photoToDataUrl(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8);
  } finally { URL.revokeObjectURL(url); }
}

function addFiles(list){
  const d = S.draft; const max = 6;
  const arr = Array.from(list||[]).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  const added = [];
  for (const f of arr) { if (d.files.length >= max) break; const it = {blob:f, url:URL.createObjectURL(f)}; d.files.push(it); added.push(it); }
  d.error = arr.length && d.files.length >= max ? `Höchstens ${max} Fotos auf einmal.` : "";
  if (added.length) startCrop(added, () => go("new"), () => go("new"));
  else renderMain();
}

/* ---------- crop a photo to the part with the vocabulary ---------- */
function startCrop(items, done, cancel){
  S.crop = {items, i:0, done, cancel, r:{x:0, y:0, w:1, h:1}};
  go("crop");
}
function viewCrop(){
  const c = S.crop; if (!c) { S.view = "lists"; return viewLists(); }
  const it = c.items[c.i];
  const rect = h("div",{class:"crop-rect",id:"cropRect"},
    ["nw","ne","sw","se"].map(k => h("span",{class:"crop-h "+k,"data-h":k})));
  const img = h("img",{src:it.url,alt:"Foto zum Zuschneiden",draggable:"false",onload:()=>place()});
  const wrap = h("div",{class:"crop-wrap",id:"cropWrap"}, img, rect);
  const place = () => {
    const r = c.r;
    Object.assign(rect.style,{left:r.x*100+"%",top:r.y*100+"%",width:r.w*100+"%",height:r.h*100+"%"});
  };
  place();
  // drag corners to resize, drag inside to move (finger or mouse)
  let drag = null;
  wrap.addEventListener("pointerdown", e => {
    const hd = e.target.closest(".crop-h"); const inRect = e.target.closest(".crop-rect");
    if (!hd && !inRect) return;
    e.preventDefault(); wrap.setPointerCapture(e.pointerId);
    drag = {mode: hd ? hd.dataset.h : "move", x:e.clientX, y:e.clientY, r:{...c.r}};
  });
  wrap.addEventListener("pointermove", e => {
    if (!drag) return;
    const b = wrap.getBoundingClientRect();
    const dx = (e.clientX - drag.x) / b.width, dy = (e.clientY - drag.y) / b.height;
    const o = drag.r, min = .08; let {x,y,w,h:hh} = o;
    if (drag.mode === "move") { x = Math.min(1-w, Math.max(0, o.x+dx)); y = Math.min(1-hh, Math.max(0, o.y+dy)); }
    else {
      if (drag.mode.includes("w")) { x = Math.min(o.x+o.w-min, Math.max(0, o.x+dx)); w = o.x+o.w-x; }
      if (drag.mode.includes("e")) { w = Math.min(1-o.x, Math.max(min, o.w+dx)); }
      if (drag.mode.includes("n")) { y = Math.min(o.y+o.h-min, Math.max(0, o.y+dy)); hh = o.y+o.h-y; }
      if (drag.mode.includes("s")) { hh = Math.min(1-o.y, Math.max(min, o.h+dy)); }
    }
    c.r = {x,y,w,h:hh}; place();
  });
  const end = () => { drag = null; };
  wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
  const next = () => {
    c.i++; c.r = {x:0, y:0, w:1, h:1};
    if (c.i >= c.items.length) { const f = c.done; S.crop = null; f(); } else renderMain();
  };
  return h("div",{class:"sheet"},
    h("div",null,
      h("p",{class:"label"}, c.items.length > 1 ? `Foto ${c.i+1} von ${c.items.length}` : "Foto zuschneiden"),
      h("h2",null,"Nur die Vokabeln einrahmen")),
    h("p",{class:"small muted"},"Ziehe die Ecken des Rahmens, bis nur die Vokabelliste darin ist. Überschriften, Bilder und Ränder kannst du weglassen."),
    h("div",{class:"crop-stage"}, wrap),
    h("div",{class:"row"},
      h("button",{class:"btn hl grow",onclick:async e=>{
        e.currentTarget.disabled = true; e.currentTarget.textContent = "Wird zugeschnitten …";
        try { await applyCrop(it, c.r); } catch {}
        next();
      }},"Zuschneiden"),
      h("button",{class:"btn ghost",onclick:next},"Ganzes Foto")),
    h("button",{class:"btn ghost",onclick:()=>{
      const f = c.cancel; const d = S.draft;
      if (d) d.files = d.files.filter(x => !c.items.includes(x));
      S.crop = null; f();
    }},"Abbrechen")
  );
}
async function applyCrop(it, r){
  if (r.x < .01 && r.y < .01 && r.w > .98 && r.h > .98) return;
  const img = new Image(); img.src = it.url; await img.decode();
  const W = img.naturalWidth, H = img.naturalHeight;
  const sx = Math.round(r.x*W), sy = Math.round(r.y*H), sw = Math.round(r.w*W), sh = Math.round(r.h*H);
  const cv = document.createElement("canvas"); cv.width = sw; cv.height = sh;
  cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const blob = await new Promise(res => cv.toBlob(res, "image/jpeg", 0.93));
  if (!blob) return;
  it.blob = blob; it.url = URL.createObjectURL(blob);
}

/* ---------- text recognition on the device (Tesseract) ---------- */
const OCR_CODES = {en:"eng", es:"spa", fr:"fra", la:"lat"};
let ocrWorker = null, ocrLang = null, ocrProgress = null, tessLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoading) tessLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res; s.onerror = () => { tessLoading = null; rej(new Error("load")); };
    document.head.append(s);
  });
  return tessLoading;
}
async function getWorker(lang){
  if (ocrWorker && ocrLang === lang) return ocrWorker;
  if (ocrWorker) { try { await ocrWorker.terminate(); } catch {} ocrWorker = null; }
  ocrWorker = await Tesseract.createWorker([OCR_CODES[lang] || "eng", "deu"], 1, {
    logger: m => ocrProgress && ocrProgress(m),
  });
  ocrLang = lang;
  return ocrWorker;
}
function stopOcr(){
  const w = ocrWorker; ocrWorker = null; ocrLang = null;
  if (w) w.terminate().catch(()=>{});
}
function setProgress(label, pct){
  const d = S.draft; if (!d) return;
  d.progress = {label, pct};
  const l = $("#ocrLabel"), b = $("#ocrBar");
  if (l) l.textContent = label;
  if (b) b.style.width = Math.round((pct||0)*100) + "%";
}
async function prepImage(file, opts = {}){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const big = Math.max(img.naturalWidth, img.naturalHeight);
    // small pictures (screenshots) are enlarged, large photos reduced
    const sc = Math.min(opts.upscale ? 3 : 2, (opts.upscale ? 2600 : 2200) / big);
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    const g = c.getContext("2d", {willReadFrequently:true});
    g.imageSmoothingQuality = "high";
    g.drawImage(img, 0, 0, c.width, c.height);
    // gray from the darkest colour channel: blue, red or green ink turns dark
    const id = g.getImageData(0, 0, c.width, c.height), px = id.data;
    const gray = new Uint8ClampedArray(px.length / 4), hist = new Uint32Array(256);
    for (let i = 0, j = 0; i < px.length; i += 4, j++) {
      const r = px[i], gg = px[i+1], b = px[i+2], lum = (r*299 + gg*587 + b*114) / 1000;
      // lum: normal; max: coloured marker backgrounds turn white; min: coloured ink turns dark
      const v = opts.gray === "max" ? Math.max(r, gg, b) * 0.6 + lum * 0.4
              : opts.gray === "min" ? Math.min(r, gg, b) * 0.75 + lum * 0.25
              : lum;
      gray[j] = v; hist[gray[j]]++;
    }
    // stretch contrast between the 2nd and 98th percentile
    const n = gray.length; let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * 0.02) { lo = v; break; } }
    acc = 0; for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= n * 0.02) { hi = v; break; } }
    const span = Math.max(30, hi - lo);
    for (let i = 0, j = 0; i < px.length; i += 4, j++) {
      const v = Math.max(0, Math.min(255, (gray[j] - lo) * 255 / span));
      px[i] = px[i+1] = px[i+2] = v;
    }
    g.putImageData(id, 0, 0);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
async function recognize(){
  const d = S.draft; if (!d.files.length || d.busy) return;
  d.busy = true; d.cancelled = false; d.error = ""; d.note = "";
  d.progress = {label:"Texterkennung wird geladen …", pct:0};
  renderMain();
  const n = d.files.length; let page = 0;
  if (!d.append) d.pages = [];
  d.pages = d.pages || [];
  const pageBase = d.pages.length;
  ocrProgress = m => {
    if (d.cancelled) return;
    if (m.status === "recognizing text") { const l = $("#ocrLabel"); if (l && !/Versuch/.test(l.textContent)) setProgress(n > 1 ? `Seite ${page+1} von ${n} wird gelesen …` : "Text wird gelesen …", (page + (m.progress||0)) / n); }
    else if (/load|initializ/i.test(m.status||"")) setProgress("Sprachdaten werden geladen (nur beim ersten Mal, kann etwas dauern) …", m.progress||0);
  };
  try {
    await loadTesseract();
    let worker = await getWorker(d.lang);
    const all = []; const notes = new Set(); let title = ""; const raw = [];
    for (page = 0; page < n; page++) {
      if (d.cancelled) break;
      setProgress(n > 1 ? `Seite ${page+1} von ${n} wird vorbereitet …` : "Foto wird vorbereitet …", page / n);
      let res = null, rawText = "", bestScore = -1e9;
      const quality = r => {
        const full = r.pairs.filter(p => p.fx && p.de).length;
        const shaky = r.pairs.filter(p => /\s\?$/.test(p.fx) || /\s\?$/.test(p.de) || !p.fx || !p.de).length;
        return full * 2 - shaky * 1.5;
      };
      // several ways to prepare the picture; the result with the most clean pairs wins
      const attempts = [{gray:"lum"}, {gray:"max"}, {gray:"min", upscale:true, psm:"6"}];
      for (let ai = 0; ai < attempts.length; ai++) {
        const attempt = attempts[ai];
        if (d.cancelled) break;
        if (ai === 2 && res && res.pairs.length >= 3 && quality(res) >= res.pairs.length * 1.6) break;
        if (ai > 0) setProgress(n > 1 ? `Seite ${page+1} von ${n}: Versuch ${ai+1} von 3 …` : `Versuch ${ai+1} von 3 …`, (page + ai / 3) / n);
        const canvas = await prepImage(d.files[page].blob, attempt);
        worker = await getWorker(d.lang);
        await worker.setParameters({tessedit_pageseg_mode: attempt.psm || "3"});
        let { data } = await worker.recognize(canvas);
        if (!(data.words || []).length) {
          // the phone may have run short of memory – restart the recogniser and try once more
          stopOcr(); const w2 = await getWorker(d.lang);
          await w2.setParameters({tessedit_pageseg_mode: attempt.psm || "3"});
          ({ data } = await w2.recognize(canvas));
        }
        canvas.width = canvas.height = 1;
        const words = (data.lines || []).flatMap((l, li) => (l.words || []).map(w => ({text:w.text, conf:w.confidence, line:li, x0:w.bbox.x0, y0:w.bbox.y0, x1:w.bbox.x1, y1:w.bbox.y1})));
        const angle = VkPair.tiltFromBaselines((data.lines || []).map(l => l.baseline));
        const r = VkPair.pairFromWords(words, {angle});
        const q = quality(r);
        if (!res || q > bestScore) { res = r; bestScore = q; }
        if ((data.text || "").trim().length > rawText.length) rawText = (data.text || "").trim();
      }
      if (!res.pairs.length && rawText) raw.push(rawText);
      const no = pageBase + page + 1;
      res.pairs.forEach(p => { p.page = no; });
      d.pages.push({no, url: d.files[page].url, count: res.pairs.length, skipped: res.skipped || 0});
      all.push(...res.pairs);
      if (!title && res.title) title = res.title;
      if (res.note) notes.add(res.note);
      if (res.swapped) notes.add("Die deutsche Spalte stand links und wurde nach rechts sortiert.");
    }
    if (d.cancelled) { d.busy = false; if (d.append) { d.append = false; d.files = []; go("review"); } else renderMain(); return; }
    if (!all.length && raw.length && d.append) {
      d.busy = false; ocrProgress = null; d.append = false; d.files = [];
      d.error = "Auf dem neuen Foto konnten keine Vokabelpaare zugeordnet werden. Versuch ein schärferes Foto direkt vom Blatt.";
      go("review"); return;
    }
    if (!all.length && raw.length) {
      d.text = raw.join("\n"); d.textOpen = true; d.busy = false; ocrProgress = null;
      d.error = "Die Spalten konnten nicht zugeordnet werden. Der gelesene Text steht unten unter „Oder als Text einfügen“. Dort pro Zeile „englisch – deutsch“ korrigieren und übernehmen, oder ein schärferes Foto direkt vom Blatt verwenden (kein Bildschirmfoto).";
      renderMain(); return;
    }
    if (!all.length) throw {code:"empty"};
    if (!d.title && title) d.title = title.slice(0, 80);
    const fresh = all.map(p => ({id:uid(), fx:p.fx, de:p.de, box:0, page:p.page}));
    d.scrollTo = pageBase + 1;
    if (d.append) {
      d.pairs = [...(d.pairs || []), ...fresh];
      notes.add(`${fresh.length} Vokabeln vom neuen Foto angehängt – sie stehen unter „Foto ${pageBase + 1}“.`);
    } else d.pairs = fresh;
    d.append = false; d.files = [];
    d.note = [...notes].join(" ");
    d.busy = false; ocrProgress = null;
    go("review");
  } catch (e) {
    d.busy = false; ocrProgress = null;
    if (d.cancelled) { renderMain(); return; }
    d.error = e && e.code === "empty"
      ? "Auf dem Foto wurden keine Vokabeln gefunden. Nimm ein Foto direkt vom Blatt (kein Bildschirmfoto aus einer anderen App): gerade, hell und so nah, dass die Liste das Bild füllt."
      : (e && e.message === "load")
        ? "Die Texterkennung konnte nicht geladen werden. Prüfe die Internetverbindung und versuche es noch einmal."
        : "Die Erkennung hat nicht geklappt. Bitte noch einmal versuchen oder die Vokabeln als Text einfügen.";
    stopOcr();
    if (d.append) { d.append = false; d.files = []; go("review"); } else renderMain();
  }
}

function fromText(){
  const d = S.draft;
  const pairs = d.text.split(/\r?\n/).map(line => {
    const m = line.split(/\t|\s[–—=-]\s|\s*=\s*|\s[–—]\s?/);
    if (m.length < 2) return null;
    return {id:uid(), fx:m[0].trim(), de:m.slice(1).join(" – ").trim(), box:0};
  }).filter(p => p && (p.fx || p.de));
  if (!pairs.length) { d.error = "Keine Paare gefunden. Trenne Fremdwort und Deutsch mit – oder =."; renderMain(); return; }
  d.pairs = pairs; d.error = ""; go("review");
}
function editList(l){

function viewReview(){

      pg.skipped ? h("p",{class:"small warnline"},`${pg.skipped} Stelle${pg.skipped>1?"n":""} auf diesem Foto nicht lesbar. Bitte mit dem Foto vergleichen und fehlende Vokabeln ergänzen.`) : null,

            h("span",{class:"small grow"},`Foto ${pg.no} und seine ${d.pairs.filter(q=>q.page===pg.no).length} Vokabeln löschen?`),

            h("button",{class:"btn ghost mini grow",onclick:addHere},`+ Zeile zu Foto ${pg.no}`),

  };

    d.pairs.forEach(q => { if (q.page) q.page = map[q.page]; });

    h("div",null,h("p",{class:"label"},d.id?"Liste bearbeiten":"Erkannt – bitte kurz prüfen"),h("h2",null,"Stimmt alles?")),

    h("div",{class:"edit"},

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startSession(l, onlyHard, onlyIds){
  let items = l.pairs.filter(p => onlyIds ? onlyIds.includes(p.id) : onlyHard ? (p.box||0)<3 : true);
  if (!items.length) items = l.pairs.slice();
  const queue = shuffle(items.map(p => ({id:p.id, dir: prefs.dir==="mix" ? (Math.random()<.5?"fx":"de") : prefs.dir})));
  S.session = {listId:l.id, lang:l.lang, queue, total:queue.length, firstTry:{}, wrong:0, missed:new Set(),
    correct:new Set(), round:1, roundTotal:queue.length, asked:0, wrongRound:[], repeat:!!prefs.repeatWrong, roundIntro:false,
    phase:"ask", input:"", verdict:null, mode:prefs.mode};
  go("practice");
}
function curItem(){ const s=S.session; const it=s.queue[0]; const l=S.lists.find(x=>x.id===s.listId); const p=l?.pairs.find(x=>x.id===it?.id); return {it,p,l}; }
function viewPractice(){
  const s = S.session; const {it,p,l} = curItem();
  if (!it || !p) return viewDone();
  const L = LANGS[s.lang]||LANGS.en;
  const ask = it.dir==="fx" ? p.fx : p.de;
  const sol = it.dir==="fx" ? p.de : p.fx;
  const answerLang = it.dir==="fx" ? "de" : s.lang;
  const fromName = it.dir==="fx" ? L.name : "Deutsch", toName = it.dir==="fx" ? "Deutsch" : L.name;
  const pos = Math.min(s.asked + 1, s.roundTotal);
  const head = h("div",{class:"progress2"},
    h("div",{class:"pg-row"},
      h("span",{class:"pg-label small"}, s.round > 1 ? `Runde ${s.round}` : "Vokabel"),
      h("div",{class:"bar","aria-hidden":"true"},h("i",{class:"bar-asked",style:{width:(s.asked / s.roundTotal * 100)+"%"}})),
      h("span",{class:"small nums pg-num"},`${pos} / ${s.roundTotal}`),
      h("button",{class:"speak",onclick:()=>finishSession(true)},"Beenden")),
    h("div",{class:"pg-row"},
      h("span",{class:"pg-label small"},"Richtig"),
      h("div",{class:"bar","aria-hidden":"true"},h("i",{style:{width:(s.correct.size / s.total * 100)+"%"}})),
      h("span",{class:"small nums pg-num ok-num"},`${s.correct.size} / ${s.total}`),
      h("span",{class:"pg-spacer"})));

  if (s.roundIntro) {
    return h("div",{class:"practice"},head,
      h("div",{class:"card"},
        h("div",{class:"prompt"},`Runde ${s.round}`),
        h("p",{style:{textAlign:"center"}},`${s.roundTotal} Vokabel${s.roundTotal>1?"n waren":" war"} noch nicht richtig. ${s.roundTotal>1?"Die kommen":"Sie kommt"} jetzt noch einmal dran.`),
        h("button",{class:"btn hl",id:"roundGo",onclick:()=>{s.roundIntro=false;renderMain();}},"Weiter")));
  }

  const speakBtn = (L.tts && it.dir==="fx") ? h("button",{class:"speak","aria-label":"Vorlesen",onclick:e=>speak(p.fx,L.tts,e.currentTarget)},"Anhören") : null;

  const card = h("div",{class:"card"},
    h("div",{class:"dir small muted"},h("span",null,`${fromName} → ${toName}`),speakBtn),
    h("div",{class:"prompt",lang:it.dir==="fx"?L.tts||"":"de"},ask));

  if (s.mode === "card") {
    if (s.phase === "ask") {
      card.append(h("button",{class:"btn hl",id:"flip",onclick:()=>{s.phase="shown";renderMain();}},"Umdrehen"));
    } else {
      card.append(h("div",{class:"feedback"},h("span",{class:"sol"},sol),
          (L.tts && it.dir==="de") ? h("button",{class:"speak",onclick:e=>speak(p.fx,L.tts,e.currentTarget)},"Anhören") : null),
        h("div",{class:"row"},
          h("button",{class:"btn ghost grow",onclick:()=>grade(false)},"Wusste ich nicht"),
          h("button",{class:"btn hl grow",id:"knew",onclick:()=>grade(true)},"Gewusst")));
    }
    setTimeout(()=>($("#flip")||$("#knew"))?.focus());
    return h("div",{class:"practice"},head,card);
  }

  // writing mode
  const v = s.verdict;
  const inp = h("input",{class:"answer-in"+(v?(v.ok?" ok":" bad"):""),id:"answer",autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false",
    lang:answerLang==="de"?"de":(L.tts||""),placeholder:`Auf ${toName} schreiben …`,value:s.input,readonly:s.phase!=="ask",
    oninput:e=>s.input=e.target.value,
    onfocus:()=>keepTop(),
    onkeydown:e=>{ if(e.key==="Enter"){ e.preventDefault(); s.phase==="ask" ? check() : next(); } }});
  card.append(inp);
  const chars = (answerLang!=="de" ? L.chars : []);
  if (s.phase==="ask" && chars.length) card.append(h("div",{class:"chars"}, chars.map(c=>h("button",{type:"button","aria-label":`${c} einfügen`,
    onmousedown:e=>e.preventDefault(), onclick:()=>insertChar(c)},c))));
  if (s.phase==="ask") {
    card.append(h("div",{class:"row"},
      h("button",{class:"btn ghost",onclick:()=>{s.input="";s.verdict={ok:false,msg:"Übersprungen"};s.phase="checked";record(false);renderMain();}},"Weiß ich nicht"),
      h("button",{class:"btn hl grow",onclick:check},"Prüfen")));
  } else {
    card.append(h("div",{class:"feedback "+(v.ok?"ok":"bad")},
      h("strong",null,v.msg),
      !v.ok || v.alt ? h("span",{class:"sol"},sol) : null,
      (L.tts && answerLang!=="de") ? h("button",{class:"speak",onclick:e=>speak(p.fx,L.tts,e.currentTarget)},"Anhören") : null));
    card.append(h("div",{class:"row"},
      (!v.ok && s.input.trim()) ? h("button",{class:"btn ghost",onclick:override},"War doch richtig") : null,
      h("button",{class:"btn hl grow",id:"nextBtn",onclick:next},"Weiter")));
  }
  setTimeout(()=>{ const a=$("#answer"); if (s.phase==="ask") { a?.focus({preventScroll:true}); } else $("#nextBtn")?.focus({preventScroll:true}); keepTop(); });
  return h("div",{class:"practice"},head,card);
}
/* keep word, input and buttons in view above the on-screen keyboard */
function keepTop(){
  if (S.view !== "practice") return;
  [0, 120, 350].forEach(t => setTimeout(() => window.scrollTo(0, 0), t));
}
try { window.visualViewport && visualViewport.addEventListener("resize", keepTop); } catch {}
function insertChar(c){
  const a = $("#answer"); if (!a) return;
  const st = a.selectionStart ?? a.value.length, en = a.selectionEnd ?? a.value.length;
  a.value = a.value.slice(0,st)+c+a.value.slice(en); S.session.input = a.value;
  a.focus(); a.setSelectionRange(st+1, st+1);
}
/* Read a word aloud. On the iPhone speak() must run directly inside the tap,
   and cancel() right before speak() swallows the new utterance – so we only
   cancel when something is still playing, pick a matching voice, and show a
   hint when no sound starts (phone set to silent, volume off). */
let voiceList = [];
function loadVoices(){ try { voiceList = speechSynthesis.getVoices() || []; } catch {} }
try { loadVoices(); speechSynthesis.addEventListener?.("voiceschanged", () => { loadVoices(); if (S.view === "setup") renderMain(); }); } catch {}
const REGION = {GB:"britisch", US:"amerikanisch", AU:"australisch", IE:"irisch", IN:"indisch", ZA:"südafrikanisch", CA:"kanadisch", ES:"Spanien", MX:"Mexiko", FR:"Frankreich", "419":"Lateinamerika", AR:"Argentinien", CO:"Kolumbien", BE:"Belgien", CH:"Schweiz"};
function voicePicker(langKey){
  const L = LANGS[langKey]; if (!L || !L.tts) return null;
  const short = L.tts.slice(0, 2);
  if (!voiceList.length) loadVoices();
  const vs = voiceList.filter(v => v.lang && v.lang.toLowerCase().startsWith(short))
    .sort((a, b) => (a.lang === L.tts ? -1 : 0) - (b.lang === L.tts ? -1 : 0) || a.name.localeCompare(b.name));
  prefs.voices = prefs.voices || {};
  const cur = prefs.voices[short] || "";
  const sample = {en:"Hello, how are you today?", es:"Hola, ¿qué tal?", fr:"Bonjour, comment ça va ?"}[short] || "Hello";
  return h("div",{class:"field"},
    h("span",{class:"label"},"Stimme zum Anhören"),
    vs.length
      ? h("div",{class:"row"},
          h("select",{id:"voiceSel",class:"grow",style:{minWidth:"0"},onchange:e=>{ prefs.voices[short] = e.target.value; ls.set("vk-prefs", prefs); }},
            h("option",{value:"",selected:!cur},"Automatisch"),
            vs.map(v => { const rg = (v.lang.split(/[-_]/)[1] || "").toUpperCase();
              return h("option",{value:v.voiceURI,selected:v.voiceURI===cur}, `${v.name}${REGION[rg] ? " – " + REGION[rg] : rg ? " – " + rg : ""}`); })),
          h("button",{class:"btn ghost",type:"button",onclick:e=>speak(sample, L.tts, e.currentTarget)},"Probe hören"))
      : h("p",{class:"small muted"},"Die Stimmen des Geräts werden geladen …"),
    h("span",{class:"small muted"},"Tipp für Englisch: „Daniel“ oder „Arthur“ (britisch, männlich). Weitere, natürlichere Stimmen: iPhone-Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Englisch."));
}
function speak(text, lang, btn){
  const label = btn ? btn.textContent : "";
  const hint = msg => { if (!btn) return; btn.textContent = msg; setTimeout(() => { btn.textContent = label; }, 4000); };
  if (!("speechSynthesis" in window)) { hint("Vorlesen geht auf diesem Gerät nicht"); return; }
  try {
    const synth = window.speechSynthesis;
    if (synth.speaking || synth.pending) synth.cancel();
    if (!voiceList.length) loadVoices();
    const want = lang.toLowerCase(), short = want.slice(0, 2);
    const chosenURI = (prefs.voices || {})[short];
    const voice = (chosenURI && voiceList.find(v => v.voiceURI === chosenURI))
               || voiceList.find(v => v.lang && v.lang.toLowerCase().replace("_","-") === want)
               || voiceList.find(v => v.lang && v.lang.toLowerCase().startsWith(short));
    const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)|\s\?$/g, "").trim());
    if (voice) { try { u.voice = voice; } catch {} }
    u.lang = voice ? voice.lang : lang; u.rate = .9; u.volume = 1;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = () => { if (!started) hint("Kein Ton – Lautlos-Schalter und Lautstärke prüfen"); };
    synth.resume();
    synth.speak(u);
    setTimeout(() => { if (!started && !synth.speaking) hint("Kein Ton – Lautlos-Schalter und Lautstärke prüfen"); }, 1800);
  } catch { hint("Vorlesen hat nicht geklappt"); }
}

/* answer checking */
const ARTICLES = /^(der|die|das|ein|eine|the|a|an|el|la|los|las|un|una|le|les|l'|une)\s+/;
function base(s){ return s.normalize("NFC").toLowerCase().replace(/[’`´]/g,"'").replace(/[.!?¡¿;:"„“”]/g,"").replace(/\s+/g," ").trim(); }
function noAcc(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss"); }
function variants(sol){
  const out = new Set();
  sol.replace(/\s\?$/,"").split(/[,;/]| oder /).forEach(alt => {
    alt = alt.trim(); if (!alt) return;
    const a = base(alt.replace(/\(.*?\)/g," "));      // ohne Klammerinhalt
    const b = base(alt.replace(/[()]/g,""));            // mit Klammerinhalt
    [a,b].forEach(x => { if (!x) return; out.add(x); out.add(x.replace(/^to /,"")); });
  });
  return [...out];
}
function judge(input, sol){
  const u = base(input).replace(/^to /,"");
  if (!u) return {ok:false,msg:"Nichts eingegeben"};
  const vs = variants(sol);
  const whole = base(sol.replace(/\s\?$/,""));
  if (vs.includes(u) || u === whole.replace(/^to /,"")) return {ok:true,msg:"Richtig!", alt: /[,;/]| oder /.test(sol)};
  if (vs.some(v => noAcc(v) === noAcc(u))) return {ok:false,msg:"Fast – achte auf Akzente und Umlaute."};
  if (vs.some(v => v.replace(ARTICLES,"") === u && v !== u)) return {ok:false,msg:"Fast – der Artikel fehlt."};
  if (vs.some(v => lev(v,u) === 1 && v.length > 4)) return {ok:false,msg:"Fast – ein Buchstabe stimmt nicht."};
  return {ok:false,msg:"Leider falsch. Richtig ist:"};
}
function lev(a,b){ if (Math.abs(a.length-b.length)>1) return 2; const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }

function check(){
  const s = S.session; const {it,p} = curItem();
  s.input = $("#answer")?.value ?? s.input;
  const sol = it.dir==="fx" ? p.de : p.fx;
  s.verdict = judge(s.input, sol);
  s.phase = "checked"; record(s.verdict.ok); renderMain();
}
function record(ok){
  const s = S.session; const it = s.queue[0];
  if (!(it.id+it.dir in s.firstTry)) s.firstTry[it.id+it.dir] = ok;
  if (!ok) { s.wrong++; s.missed.add(it.id); }
}
function override(){
  const s = S.session; const it = s.queue[0];
  s.firstTry[it.id+it.dir] = true; s.wrong = Math.max(0, s.wrong-1);
  if (!Object.entries(s.firstTry).some(([k,v]) => k.startsWith(it.id) && v===false)) s.missed.delete(it.id);
  s.verdict = {ok:true,msg:"Als richtig gewertet."}; renderMain();
}
function grade(ok){ record(ok); S.session.verdict={ok}; next(); }
function next(){
  const s = S.session; const it = s.queue.shift();
  s.asked++;
  if (s.verdict?.ok) s.correct.add(it.id+it.dir);
  else if (s.repeat) s.wrongRound.push(it);          // comes back after the whole round
  s.phase="ask"; s.input=""; s.verdict=null;
  if (!s.queue.length) {
    if (s.repeat && s.wrongRound.length) {
      s.queue = shuffle(s.wrongRound); s.wrongRound = [];
      s.round++; s.roundTotal = s.queue.length; s.asked = 0; s.roundIntro = true;
      renderMain(); return;
    }
    return finishSession(false);
  }
  renderMain();
}
async function finishSession(early){
  const s = S.session; const l = S.lists.find(x=>x.id===s.listId); if (!l) { go("lists"); return; }
  const result = {};
  for (const [k,v] of Object.entries(s.firstTry)) { const id = k.slice(0,-2); result[id] = (result[id] ?? true) && v; }
  const pairs = l.pairs.map(p => p.id in result
    ? {...p, box: result[p.id] ? Math.min(5,(p.box||0)+1) : 1}
    : p);
  s.summary = {early, answered:Object.keys(result).length, firstOk:Object.values(result).filter(Boolean).length, missed:[...s.missed]};
  if (Object.keys(result).length) {
    try { await Store.putList({...l, pairs, lastPracticed:Date.now(), sessions:(l.sessions||0)+1}); } catch {}
  }
  go("done");
}
function viewDone(){
  const s = S.session; const l = S.lists.find(x=>x.id===s?.listId);
  if (!s || !l) { S.view="lists"; return viewLists(); }
  const sm = s.summary || {answered:0,firstOk:0,missed:[]};
  const missedPairs = l.pairs.filter(p => sm.missed.includes(p.id));
  return h("div",{class:"sheet"},
    h("div",null,h("p",{class:"label"},l.title),h("h2",null, sm.early ? "Für heute beendet" : (missedPairs.length ? "Geschafft!" : "Alles auf Anhieb richtig!"))),
    h("div",{class:"stat nums"},
      h("div",null,h("strong",null,sm.answered),h("span",{class:"small muted"},"geübt")),
      h("div",null,h("strong",{style:{color:"var(--ok)"}},sm.firstOk),h("span",{class:"small muted"},"sofort richtig")),
      h("div",null,h("strong",{style:{color:"var(--bad)"}},missedPairs.length),h("span",{class:"small muted"},"mit Fehler"))),
    missedPairs.length ? [h("p",{class:"label"},"Diese Wörter nochmal anschauen"),
      h("div",{class:"heft"}, missedPairs.map(p=>[h("div",null,p.fx),h("div",null,p.de)]))] : null,
    h("div",{class:"row"},
      missedPairs.length ? h("button",{class:"btn hl grow",onclick:()=>startSession(l,false,missedPairs.map(p=>p.id))},"Nur die Fehler üben") : null,
      h("button",{class:missedPairs.length?"btn ghost":"btn hl grow",onclick:()=>startSession(l,false)},"Ganze Liste nochmal"),
      h("button",{class:"btn ghost",onclick:()=>go("lists")},"Zu den Listen"))
  );
}

/* ---------- boot ---------- */
document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view==="lists")));
renderKids(); renderMain();
Store.init();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
window.addEventListener("hashchange", checkImport);
})();
</script>
